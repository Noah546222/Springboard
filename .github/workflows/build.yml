name: Build SpinSpringBoard deb
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: Randomblock1/theos-action@v1
      - name: Create project files
        run: |
          mkdir -p SpinSpringBoard && cd SpinSpringBoard
          cat > Makefile <<'SSB_EOF_0'
          TARGET := iphone:clang:latest:15.0
          INSTALL_TARGET_PROCESSES = SpringBoard
          ARCHS = arm64 arm64e
          THEOS_PACKAGE_SCHEME = rootless

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = SpinSpringBoard
          SpinSpringBoard_FILES = Tweak.x
          SpinSpringBoard_CFLAGS = -fobjc-arc
          SpinSpringBoard_FRAMEWORKS = UIKit QuartzCore

          include $(THEOS_MAKE_PATH)/tweak.mk
          SUBPROJECTS += prefs
          include $(THEOS_MAKE_PATH)/aggregate.mk
          SSB_EOF_0
          cat > control <<'SSB_EOF_1'
          Package: com.user.spinspringboard
          Name: SpinSpringBoard
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: Spin your icons, dock and pages with adjustable speed and direction.
          Maintainer: you
          Author: you
          Section: Tweaks
          Depends: firmware (>= 15.0), preferenceloader
          SSB_EOF_1
          cat > SpinSpringBoard.plist <<'SSB_EOF_2'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>Filter</key><dict><key>Bundles</key><array><string>com.apple.springboard</string></array></dict>
          </dict></plist>
          SSB_EOF_2
          cat > Tweak.x <<'SSB_EOF_3'
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <objc/runtime.h>

          #define PREFS_ID @"com.user.spinspringboard"
          #define PREFS_NOTIFY CFSTR("com.user.spinspringboard/prefschanged")

          @interface SBIconView : UIView
          @property (nonatomic, copy) NSString *location;
          @property (nonatomic, retain) id icon;
          @end
          @interface SBIconListView : UIView
          @property (nonatomic, copy) NSString *iconLocation;
          @end
          @interface SBDockIconListView : SBIconListView @end
          @interface SBDockView : UIView @end
          @interface SBFolderIcon : NSObject @end

          static NSString *const kAnimKey = @"ssb_spin";
          static const void *kSigKey = &kSigKey;
          static const void *kRandKey = &kRandKey;

          static BOOL gEnabled = YES, gIcons = YES, gDockIcons = YES, gFolders = YES, gDockBG = NO, gPages = NO;
          static NSInteger gDirection = 0;   // 0 = right (clockwise), 1 = left, 2 = random per item
          static double gRPM = 20.0;         // rotations per minute
          static NSHashTable *gViews;

          static BOOL boolPref(NSUserDefaults *d, NSString *k, BOOL def) {
              id v = [d objectForKey:k];
              return v ? [v boolValue] : def;
          }

          static void loadPrefs(void) {
              NSUserDefaults *d = [[NSUserDefaults alloc] initWithSuiteName:PREFS_ID];
              gEnabled   = boolPref(d, @"enabled", YES);
              gIcons     = boolPref(d, @"icons", YES);
              gDockIcons = boolPref(d, @"dockIcons", YES);
              gFolders   = boolPref(d, @"folders", YES);
              gDockBG    = boolPref(d, @"dockBG", NO);
              gPages     = boolPref(d, @"pages", NO);
              id dir = [d objectForKey:@"direction"];
              gDirection = dir ? [dir integerValue] : 0;
              id spd = [d objectForKey:@"speed"];
              gRPM = spd ? [spd doubleValue] : 20.0;
              if (gRPM < 0.5) gRPM = 0.5;
          }

          // force = rebuild the animation even if one is already running
          static void ssb_apply(UIView *v, BOOL spin, BOOL force) {
              if (!v) return;
              CALayer *layer = v.layer;
              BOOL running = [layer animationForKey:kAnimKey] != nil;

              if (!spin || !gEnabled) {
                  if (running) [layer removeAnimationForKey:kAnimKey];
                  return;
              }
              if (running && !force) return;

              int dir;
              if (gDirection == 0) dir = 1;
              else if (gDirection == 1) dir = -1;
              else {
                  NSNumber *r = objc_getAssociatedObject(v, kRandKey);
                  if (!r) {
                      r = @(arc4random_uniform(2) ? 1 : -1);
                      objc_setAssociatedObject(v, kRandKey, r, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  }
                  dir = r.intValue;
              }
              if (gDirection != 2) objc_setAssociatedObject(v, kRandKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);

              double dur = 60.0 / gRPM;
              NSString *sig = [NSString stringWithFormat:@"%d|%.3f", dir, dur];
              if (running && [objc_getAssociatedObject(v, kSigKey) isEqualToString:sig]) return;

              [layer removeAnimationForKey:kAnimKey];
              CABasicAnimation *a = [CABasicAnimation animationWithKeyPath:@"transform.rotation.z"];
              a.fromValue = @0;
              a.toValue = @(dir * 2.0 * M_PI);
              a.duration = dur;
              a.repeatCount = HUGE_VALF;
              a.additive = YES;
              a.removedOnCompletion = NO;
              a.timingFunction = [CAMediaTimingFunction functionWithName:kCAMediaTimingFunctionLinear];
              [layer addAnimation:a forKey:kAnimKey];
              objc_setAssociatedObject(v, kSigKey, sig, OBJC_ASSOCIATION_COPY_NONATOMIC);
          }

          static BOOL ssb_iconShouldSpin(SBIconView *v) {
              NSString *loc = [v respondsToSelector:@selector(location)] ? v.location : nil;
              if ([loc containsString:@"Dock"]) return gDockIcons;
              if ([v.icon isKindOfClass:%c(SBFolderIcon)]) return gFolders;
              return gIcons;
          }

          static UIView *ssb_dockBG(SBDockView *dock) {
              @try { return [dock valueForKey:@"backgroundView"]; } @catch (id e) {}
              @try { return [dock valueForKey:@"_backgroundView"]; } @catch (id e) {}
              return nil;
          }

          static BOOL ssb_pageShouldSpin(SBIconListView *lv) {
              if ([lv isKindOfClass:%c(SBDockIconListView)]) return NO;
              NSString *loc = [lv respondsToSelector:@selector(iconLocation)] ? lv.iconLocation : nil;
              if (loc && ![loc containsString:@"Root"]) return NO;
              return gPages;
          }

          static void ssb_update(UIView *v, BOOL force) {
              if ([v isKindOfClass:%c(SBIconView)]) {
                  ssb_apply(v, ssb_iconShouldSpin((SBIconView *)v), force);
              } else if ([v isKindOfClass:%c(SBDockView)]) {
                  ssb_apply(ssb_dockBG((SBDockView *)v), gDockBG, force);
              } else if ([v isKindOfClass:%c(SBIconListView)]) {
                  ssb_apply(v, ssb_pageShouldSpin((SBIconListView *)v), force);
              }
          }

          static void refreshAll(void) {
              loadPrefs();
              dispatch_async(dispatch_get_main_queue(), ^{
                  for (UIView *v in [gViews allObjects]) ssb_update(v, YES);
              });
          }

          static void prefsChanged(CFNotificationCenterRef c, void *o, CFStringRef n, const void *obj, CFDictionaryRef u) {
              refreshAll();
          }

          %hook SBIconView
          - (void)didMoveToWindow {
              %orig;
              [gViews addObject:self];
              ssb_update(self, NO);
          }
          - (void)layoutSubviews {
              %orig;
              ssb_update(self, NO);
          }
          %end

          %hook SBDockView
          - (void)didMoveToWindow {
              %orig;
              [gViews addObject:self];
              ssb_update(self, NO);
          }
          - (void)layoutSubviews {
              %orig;
              ssb_update(self, NO);
          }
          %end

          %hook SBIconListView
          - (void)didMoveToWindow {
              %orig;
              [gViews addObject:self];
              ssb_update(self, NO);
          }
          %end

          %ctor {
              gViews = [NSHashTable weakObjectsHashTable];
              loadPrefs();
              CFNotificationCenterAddObserver(CFNotificationCenterGetDarwinNotifyCenter(), NULL, prefsChanged,
                  PREFS_NOTIFY, NULL, CFNotificationSuspensionBehaviorDeliverImmediately);
          }
          SSB_EOF_3
          mkdir -p prefs
          cat > prefs/Makefile <<'SSB_EOF_4'
          TARGET := iphone:clang:latest:15.0
          ARCHS = arm64 arm64e

          include $(THEOS)/makefiles/common.mk

          BUNDLE_NAME = SpinSpringBoardPrefs
          SpinSpringBoardPrefs_FILES = SSBRootListController.m
          SpinSpringBoardPrefs_FRAMEWORKS = UIKit
          SpinSpringBoardPrefs_PRIVATE_FRAMEWORKS = Preferences
          SpinSpringBoardPrefs_INSTALL_PATH = /Library/PreferenceBundles
          SpinSpringBoardPrefs_CFLAGS = -fobjc-arc

          include $(THEOS_MAKE_PATH)/bundle.mk
          SSB_EOF_4
          mkdir -p prefs
          cat > prefs/SSBRootListController.h <<'SSB_EOF_5'
          #import <Preferences/PSListController.h>
          @interface SSBRootListController : PSListController
          @end
          SSB_EOF_5
          mkdir -p prefs
          cat > prefs/SSBRootListController.m <<'SSB_EOF_6'
          #import "SSBRootListController.h"

          @implementation SSBRootListController
          - (NSArray *)specifiers {
              if (!_specifiers) {
                  _specifiers = [self loadSpecifiersFromPlistName:@"Root" target:self];
              }
              return _specifiers;
          }
          @end
          SSB_EOF_6
          mkdir -p prefs/Resources
          cat > prefs/Resources/Info.plist <<'SSB_EOF_7'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleDevelopmentRegion</key><string>English</string>
          <key>CFBundleExecutable</key><string>SpinSpringBoardPrefs</string>
          <key>CFBundleIdentifier</key><string>com.user.spinspringboardprefs</string>
          <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
          <key>CFBundleName</key><string>SpinSpringBoardPrefs</string>
          <key>CFBundlePackageType</key><string>BNDL</string>
          <key>CFBundleShortVersionString</key><string>1.0.0</string>
          <key>CFBundleVersion</key><string>1.0.0</string>
          <key>NSPrincipalClass</key><string>SSBRootListController</string>
          </dict></plist>
          SSB_EOF_7
          mkdir -p prefs/Resources
          cat > prefs/Resources/Root.plist <<'SSB_EOF_8'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array>
          <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>General</string></dict>
          <dict><key>cell</key><string>PSSwitchCell</string><key>label</key><string>Enabled</string>
          <key>key</key><string>enabled</string><key>default</key><true/>
          <key>defaults</key><string>com.user.spinspringboard</string>
          <key>PostNotification</key><string>com.user.spinspringboard/prefschanged</string></dict>
          <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>What spins</string></dict>
          <dict><key>cell</key><string>PSSwitchCell</string><key>label</key><string>Home screen icons</string>
          <key>key</key><string>icons</string><key>default</key><true/>
          <key>defaults</key><string>com.user.spinspringboard</string>
          <key>PostNotification</key><string>com.user.spinspringboard/prefschanged</string></dict>
          <dict><key>cell</key><string>PSSwitchCell</string><key>label</key><string>Dock icons</string>
          <key>key</key><string>dockIcons</string><key>default</key><true/>
          <key>defaults</key><string>com.user.spinspringboard</string>
          <key>PostNotification</key><string>com.user.spinspringboard/prefschanged</string></dict>
          <dict><key>cell</key><string>PSSwitchCell</string><key>label</key><string>Folder icons</string>
          <key>key</key><string>folders</string><key>default</key><true/>
          <key>defaults</key><string>com.user.spinspringboard</string>
          <key>PostNotification</key><string>com.user.spinspringboard/prefschanged</string></dict>
          <dict><key>cell</key><string>PSSwitchCell</string><key>label</key><string>Dock background</string>
          <key>key</key><string>dockBG</string><key>default</key><false/>
          <key>defaults</key><string>com.user.spinspringboard</string>
          <key>PostNotification</key><string>com.user.spinspringboard/prefschanged</string></dict>
          <dict><key>cell</key><string>PSSwitchCell</string><key>label</key><string>Whole home screen pages</string>
          <key>key</key><string>pages</string><key>default</key><false/>
          <key>defaults</key><string>com.user.spinspringboard</string>
          <key>PostNotification</key><string>com.user.spinspringboard/prefschanged</string></dict>
          <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>Speed</string><key>footerText</key><string>Rotations per minute. 20 = one spin every 3 seconds.</string></dict>
          <dict><key>cell</key><string>PSSliderCell</string><key>key</key><string>speed</string>
          <key>default</key><real>20</real><key>min</key><real>1</real><key>max</key><real>120</real>
          <key>showValue</key><true/><key>defaults</key><string>com.user.spinspringboard</string>
          <key>PostNotification</key><string>com.user.spinspringboard/prefschanged</string></dict>
          <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>Direction</string></dict>
          <dict><key>cell</key><string>PSLinkListCell</string><key>label</key><string>Spin direction</string>
          <key>detail</key><string>PSListItemsController</string><key>key</key><string>direction</string>
          <key>default</key><integer>0</integer><key>defaults</key><string>com.user.spinspringboard</string>
          <key>validTitles</key><array><string>Right (clockwise)</string><string>Left (counter-clockwise)</string><string>Random</string></array>
          <key>validValues</key><array><integer>0</integer><integer>1</integer><integer>2</integer></array>
          <key>PostNotification</key><string>com.user.spinspringboard/prefschanged</string></dict>
          </array><key>title</key><string>SpinSpringBoard</string></dict></plist>
          SSB_EOF_8
          mkdir -p layout/Library/PreferenceLoader/Preferences
          cat > layout/Library/PreferenceLoader/Preferences/SpinSpringBoard.plist <<'SSB_EOF_9'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>entry</key><dict>
          <key>bundle</key><string>SpinSpringBoardPrefs</string>
          <key>cell</key><string>PSLinkCell</string>
          <key>detail</key><string>SSBRootListController</string>
          <key>isController</key><true/>
          <key>label</key><string>SpinSpringBoard</string>
          </dict></dict></plist>
          SSB_EOF_9
      - name: Build
        run: cd SpinSpringBoard && make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: SpinSpringBoard-deb
          path: SpinSpringBoard/packages/*.deb
